name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger from the Actions tab (e.g. re-run the pipeline or
  # re-deploy the coverage site without pushing a new commit).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS) - build, unit & e2e tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI-specific database values. dotenv does not override existing
      # environment variables, so these take precedence over the checked-in
      # .env file. Must match the mongodb service below.
      DATABASE_URI: mongodb://127.0.0.1:27017
      DATABASE_USER: admin
      DATABASE_PASS: "123456"
      DATABASE_NAME: TechRadar
    services:
      mongodb:
        image: mongo:9.0.4
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: "123456"
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh -u admin -p 123456 --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

  frontend:
    name: Frontend (Angular) - tests & production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests (Jest, with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

      - name: Production build
        run: npm run build

  coverage-site:
    # Publishes the Jest HTML coverage report to GitHub Pages so it can be
    # browsed without downloading the artifact. 
    name: Coverage report (GitHub Pages)
    runs-on: ubuntu-latest
    needs: frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
